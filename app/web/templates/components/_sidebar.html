<aside class="sidebar">
  <div class="brand-plate">
    <div class="status-dot" title="API System Online"></div>
    <h2>SecureVision</h2>
  </div>
  <nav>
    <a href="{{ url_for('web.dashboard') }}" class="{% if request.endpoint == 'web.dashboard' %}active{% endif %}">Live Monitor & Overview</a>
    <a href="{{ url_for('web.alerts') }}" class="{% if request.endpoint == 'web.alerts' %}active{% endif %}">Active Alerts</a>
    <a href="{{ url_for('web.events') }}" class="{% if request.endpoint == 'web.events' or request.endpoint == 'web.event_detail' %}active{% endif %}">Event Logs</a>
    <a href="{{ url_for('web.persons') }}" class="{% if request.endpoint == 'web.persons' %}active{% endif %}">Enrolled Persons</a>
    {% if session.get("role") == "admin" %}
      <a href="{{ url_for('web.enroll') }}" class="{% if request.endpoint == 'web.enroll' %}active{% endif %}">Enrol New Person</a>
      <a style="border-top: 1px solid var(--border-subtle); margin-top: 8px; padding-top: 20px;" href="{{ url_for('web.user_management') }}" class="{% if request.endpoint == 'web.user_management' %}active{% endif %}">User Settings</a>
    {% endif %}
  </nav>
  <div class="sys-status-footer">
    <p>Logged in securely.</p>
    <a href="{{ url_for('web.logout') }}" style="color:var(--status-warn);">Secure Logout</a>
  </div>
</aside>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SecureVision{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <h1><a href="{{ url_for('web.dashboard') }}">SecureVision Dashboard</a></h1>
    <nav>
      <a href="{{ url_for('web.dashboard') }}">Home</a>
      <a href="{{ url_for('web.events') }}">Events</a>
      <a href="{{ url_for('web.alerts') }}">Alerts</a>
      <a href="{{ url_for('web.persons') }}">Persons</a>
      <a href="{{ url_for('web.enroll') }}">Enroll</a>
      <a href="{{ url_for('web.logout') }}">Logout</a>
    </nav>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-wrap">
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
